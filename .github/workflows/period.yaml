name: Periodic Hello

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-ci-cd-nh5w.onrender.com|https://fs-ci-cd-nh5w.onrender.com/health
          max-attempts: 3
          retry-delay: 5s