name: Periodic Hello

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-ci-cd-error.onrender.com|https://fs-ci-cd-error.onrender.com
          max-attempts: 3
          retry-delay: 5s