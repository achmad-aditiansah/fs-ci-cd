name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  deployment_pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    
    - name: Install dependencies
      run: npm install
    
    - name: Check style
      run: npm run eslint
    
    - name: Run npm test
      run: npm run test
    
    - name: Run npm run build
      run: npm run build
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Run Playwright tests
      run: npm run test:e2e
    
    - name: Trigger deployment
      if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  discord_notification:
    needs: [deployment_pipeline]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
    - name: Success
      if: ${{ needs.deployment_pipeline.result == 'success' && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: success
        content: "✅ **Deployment Successful!** A new version deployed to production"
        title: "Deployment Details"
        noprefix: true
        description: |
          **Commit:** ${{ github.event.head_commit.id }}
          **Message:** ${{ github.event.head_commit.message }}
          **Author:** ${{ github.event.head_commit.author.name }}
    
    - name: Failure
      if: ${{ needs.deployment_pipeline.result == 'failure' }}
      uses: sarisia/actions-status-discord@v1
      with: 
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: failure
        content: "❌ **Build Failed!** The pipeline encountered an error"
        title: "Failure Details"
        noprefix: true
        description: |
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.event.head_commit.id }}
          **Message:** ${{ github.event.head_commit.message }}
          **Author:** ${{ github.event.head_commit.author.name }}
          **Workflow:** ${{ github.workflow }}
          **Job:** ${{ github.job }}



  tag_release:
    needs: [deployment_pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
      
    - name: Bump version and push tag
      if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch

